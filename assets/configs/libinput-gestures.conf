# OEM ChromeOS-like touchpad gestures (XFCE/Xubuntu).
# Installed to /etc/libinput-gestures.conf by modules/gestures.sh .
# Gestures invoke commands directly (no shell) — paths must be absolute.
# Mirrors the toolkit's prior Touchegg XML bindings finger-for-finger.
# If natural scrolling makes horizontal swipes feel inverted, swap the
# two 3-finger swipe left/right lines.

# --- 2-finger pinch -> zoom (browser / many apps) ---
gesture pinch in   2 /usr/bin/xdotool key ctrl+minus
gesture pinch out  2 /usr/bin/xdotool key ctrl+equal

# --- 3-finger swipes ---
gesture swipe left  3 /usr/bin/xdotool key alt+Left
gesture swipe right 3 /usr/bin/xdotool key alt+Right
gesture swipe up    3 /usr/bin/xfdashboard
gesture swipe down  3 /usr/bin/wmctrl -k on

# --- 4-finger swipes (no-op on pads that only report 3 fingers) ---
gesture swipe left  4 /usr/bin/xdotool key ctrl+alt+Left
gesture swipe right 4 /usr/bin/xdotool key ctrl+alt+Right
gesture swipe up    4 /usr/bin/xfce4-popup-whiskermenu
