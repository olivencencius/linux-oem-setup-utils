<?xml version="1.0" encoding="UTF-8"?>
<!--
    ChromeOS-like touchpad gesture bindings for touchegg.
    System-wide config, deployed by modules/gestures.sh to /etc/touchegg/.

    Bindings:
      2-finger pinch in/out  -> ctrl+- / ctrl+= (zoom in / out)
      3-finger swipe left    -> alt+Left  (browser back)
      3-finger swipe right   -> alt+Right (browser forward)
      3-finger swipe up      -> xfdashboard (window overview)
      3-finger swipe down    -> wmctrl -k on (show desktop)
      4-finger swipe left    -> ctrl+alt+Left  (previous workspace)
      4-finger swipe right   -> ctrl+alt+Right (next workspace)
      4-finger swipe up      -> super (Whisker menu / launcher analogue)

    4-finger gestures silently no-op on touchpads that only report 3 fingers.
-->
<touchégg>

  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
  </settings>

  <application name="All">

    <!-- 2-finger pinch -> zoom -->
    <gesture type="PINCH" fingers="2" direction="IN">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Control_L</modifiers>
        <keys>minus</keys>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="PINCH" fingers="2" direction="OUT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Control_L</modifiers>
        <keys>equal</keys>
        <on>begin</on>
      </action>
    </gesture>

    <!-- 3-finger swipes -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Left</keys>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Alt_L</modifiers>
        <keys>Right</keys>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xfdashboard</command>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>wmctrl -k on</command>
        <on>end</on>
      </action>
    </gesture>

    <!-- 4-finger swipes -->
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Control_L+Alt_L</modifiers>
        <keys>Left</keys>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="SEND_KEYS">
        <repeat>false</repeat>
        <modifiers>Control_L+Alt_L</modifiers>
        <keys>Right</keys>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>xfce4-popup-whiskermenu</command>
        <on>end</on>
      </action>
    </gesture>

  </application>

</touchégg>
